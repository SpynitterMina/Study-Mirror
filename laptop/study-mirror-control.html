<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Mirror</title>
<style>
  :root {
    --paper: #e9eff2;
    --ink: #14283a;
    --mute: #5d7384;
    --focus: #2b4c7e;
    --rest: #1f5a43;
    --line: #c9d6dd;
    --card: #f7fafb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: var(--paper); color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  main { width: 100%; max-width: 440px; }
  .block { text-align: center; padding: 12px 0 28px; }
  .block .n { font-family: Georgia, "Times New Roman", serif; font-size: 112px; line-height: 1; font-weight: 700; }
  .block .of { font-size: 18px; color: var(--mute); margin-top: 6px; }
  .stepper { display: inline-flex; gap: 8px; margin-top: 14px; }
  .stepper button { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 18px; cursor: pointer; }
  .actions { display: grid; gap: 12px; }
  .actions button.main {
    border: 0; border-radius: 14px; padding: 18px; font-size: 18px; font-weight: 600; cursor: pointer; color: #fff;
  }
  #start { background: var(--focus); }
  #brk { background: var(--rest); }
  #end { background: transparent; color: var(--mute); border: 1px solid var(--line); border-radius: 14px; padding: 14px; font-size: 15px; cursor: pointer; }
  .row { display: flex; gap: 10px; align-items: center; }
  .row label { font-size: 14px; color: var(--mute); }
  input { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 10px 12px; font-size: 15px; width: 100%; }
  #mins { width: 72px; }
  .pair { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line); display: grid; gap: 10px; }
  .status { margin-top: 18px; font-size: 14px; color: var(--mute); min-height: 20px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #b0bcc4; margin-right: 8px; }
  .dot.on { background: var(--rest); }
  button:focus-visible, input:focus-visible { outline: 3px solid #7aa7d9; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <section class="block" aria-live="polite">
    <div class="n" id="n">1</div>
    <div class="of">block <span id="nOf">1</span> of <span id="tot">5</span></div>
    <div class="stepper">
      <button id="bm" aria-label="Previous block">&minus;</button>
      <button id="bp" aria-label="Next block">+</button>
    </div>
  </section>

  <section class="actions">
    <button class="main" id="start">Start block</button>
    <div class="row">
      <button class="main" id="brk" style="flex:1">Start break</button>
      <input id="mins" type="number" min="1" max="60" value="10" aria-label="Break minutes">
      <label for="mins">min</label>
    </div>
    <button id="end">End session</button>
  </section>

  <div class="status"><span class="dot" id="dot"></span><span id="msg">Enter your phone's address and code below.</span></div>

  <section class="pair">
    <div class="row"><input id="ip" placeholder="Phone address, e.g. 192.168.1.5"></div>
    <div class="row"><input id="code" placeholder="Pairing code from the phone app" inputmode="numeric"></div>
    <div class="row"><label for="totIn">Blocks today</label><input id="totIn" type="number" min="1" max="12" value="5" style="width:80px"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let block = parseInt(localStorage.sm_block) || 1;
let total = parseInt(localStorage.sm_total) || 5;
$('ip').value = localStorage.sm_ip || '';
$('code').value = localStorage.sm_code || '';
$('totIn').value = total;

function paint() {
  $('n').textContent = block;
  $('nOf').textContent = block;
  $('tot').textContent = total;
  $('start').textContent = 'Start block ' + block;
  localStorage.sm_block = block; localStorage.sm_total = total;
}
function say(text, on) { $('msg').textContent = text; $('dot').className = 'dot' + (on ? ' on' : ''); }

function baseUrl() {
  let ip = $('ip').value.trim();
  if (!ip) throw new Error('Enter the phone address first.');
  if (!ip.includes(':')) ip += ':8080';
  localStorage.sm_ip = $('ip').value.trim();
  localStorage.sm_code = $('code').value.trim();
  return 'http://' + ip;
}

async function call(cmd, params = {}) {
  const q = new URLSearchParams(Object.assign({ t: $('code').value.trim() }, params)).toString();
  const url = baseUrl() + '/' + cmd + '?' + q;
  try {
    const r = await fetch(url);
    return await r.json();
  } catch (e) {
    await fetch(url, { mode: 'no-cors' });   // fallback: command still arrives, reply is hidden
    return null;
  }
}

async function run(cmd, params, okText) {
  try {
    const r = await call(cmd, params);
    if (r && r.error) { say('Phone says: ' + r.error, false); return; }
    say(okText, true);
  } catch (e) {
    say("Can't reach the phone. Same Wi-Fi? Is Study Mirror turned on?", false);
  }
}

$('start').onclick = () => run('focus', { block, total }, 'Focus started: block ' + block);
$('brk').onclick = async () => {
  const m = Math.max(1, parseInt($('mins').value) || 10);
  await run('break', { min: m }, 'Break started: ' + m + ' minutes');
  if (block < 99) { block += 1; paint(); }   // the phone also moves to the next block after the break
};
$('end').onclick = () => run('end', {}, 'Session ended');
$('bm').onclick = () => { if (block > 1) block--; paint(); };
$('bp').onclick = () => { block++; paint(); };
$('totIn').onchange = () => { total = Math.max(1, parseInt($('totIn').value) || 5); paint(); };

async function poll() {
  if (!$('ip').value.trim() || !$('code').value.trim()) return;
  try {
    const r = await call('state');
    if (r && r.mode) {
      const where = r.mode === 'IDLE' ? 'idle' : r.mode.toLowerCase() + ', block ' + r.block;
      say('Phone connected (' + where + ')', true);
    }
  } catch (e) {
    say("Can't reach the phone. Same Wi-Fi? Is Study Mirror turned on?", false);
  }
}
paint();
setInterval(poll, 5000);
</script>
</body>
</html>
